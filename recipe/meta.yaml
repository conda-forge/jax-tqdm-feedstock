{% set name = "jax-tqdm" %}
{% set version = "0.4.1" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/jax_tqdm-{{ version }}.tar.gz
  sha256: 942af4c5acc9de6d1db3ee744014acb7ed32c333c852906c0d1b82f70def6443

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - uv-build
    - pip
  run:
    - python >={{ python_min }}
    - tqdm >=4.70.1
    - jax >=0.4.12
    - chex >=0.1.90

test:
  imports:
    - jax_tqdm
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jeremiecoullon/jax-tqdm
  summary: Tqdm progress bar for JAX scans and loops
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Tobias-Fischer
